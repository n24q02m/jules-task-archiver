name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # `sha` is read by the main-integrity job only.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR title drives the squash-merge subject (repo setting squash_merge_commit_title=PR_TITLE),
  # and semantic-release only releases on conventional commits. Emoji-titled bot PRs
  # (Bolt/Palette/Sentinel) landed with non-conventional subjects and silently produced no
  # release. This gate forces a conventional title before merge; retitle + `edited` re-runs it.
  pr-title:
    name: PR Title Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.
  lint:
    name: Lint & Format
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Project SOT
        run: python -I scripts/repo-bootstrap/sot_check.py --repo . --mode gate

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # oxlint and oxfmt are pinned devDependencies in package.json and bun.lock.
      - run: bun install --frozen-lockfile

      - name: Run Biome check
        # Biome is the linter only (formatter disabled in biome.json); oxfmt below owns formatting.
        # Pin to the version declared in biome.json $schema. Unpinned `npx @biomejs/biome`
        # pulls latest, which auto-upgraded past 2.4.16 and broke CI with new lint rules
        # and deprecated config keys despite no source changes.
        run: npx @biomejs/biome@2.4.16 check .

      # Stack standard: JS/Node repos run biome (lint) plus oxlint (second correctness rule set)
      # and oxfmt (formatter of record), with bun AND deno available.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno --version
      - name: oxlint
        run: bun run lint:ox || bun x oxlint
      - name: oxfmt check
        run: bun run fmt:check || bun x oxfmt --check

      - name: Validate manifest.json
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));
            if (m.manifest_version !== 3) throw new Error('Must be Manifest V3');
            if (!m.version) throw new Error('Missing version');
            const required = ['background', 'content_scripts', 'action', 'permissions'];
            for (const k of required) {
              if (!m[k]) throw new Error('Missing: ' + k);
            }
            console.log('manifest.json valid: v' + m.version);
          "

  test:
    name: Unit Tests
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text node --test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          flags: unit
          name: jules-task-archiver

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  # ============================================================================
  # main-integrity: detective control for the default branch (scripts/main_integrity.py).
  # Rendered into ci.yml from templates/fragments/main-integrity-job.yml. It used to
  # be a third workflow file (main-integrity.yml); the two-file standard (ci.yml +
  # cd.yml, spec 2026-10-30) keeps it here. It runs only on main:
  # dispatch CI on main after a merge; `sha` audits one specific commit
  # instead of the tip. On any other ref the job is skipped.
  # ============================================================================
  main-integrity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/main_integrity.py
          sparse-checkout-cone-mode: false
      - name: Verify the commit on the branch came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/main_integrity.py --repo "$REPO" --sha "$SHA" --branch "$BRANCH"
