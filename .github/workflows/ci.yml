name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Biome check
        # Pin to the version declared in biome.json $schema. Unpinned `npx @biomejs/biome`
        # pulls latest, which auto-upgraded past 2.4.16 and broke CI with new lint rules
        # and deprecated config keys despite no source changes.
        run: npx @biomejs/biome@2.4.16 check .

      - name: Validate manifest.json
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));
            if (m.manifest_version !== 3) throw new Error('Must be Manifest V3');
            if (!m.version) throw new Error('Missing version');
            const required = ['background', 'content_scripts', 'action', 'permissions'];
            for (const k of required) {
              if (!m[k]) throw new Error('Missing: ' + k);
            }
            console.log('manifest.json valid: v' + m.version);
          "

  test:
    name: Unit Tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text node --test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          flags: unit
          name: jules-task-archiver

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  email-notify:
    name: Email Notification
    if: >-
      (github.event_name == 'issues' || github.event_name == 'pull_request')
      && github.actor != github.repository_owner
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Parse SMTP credential
        run: |
          echo "SMTP_USER=${SMTP_CREDENTIAL%%:*}" >> $GITHUB_ENV
          echo "SMTP_PASS=${SMTP_CREDENTIAL#*:}" >> $GITHUB_ENV
        env:
          SMTP_CREDENTIAL: ${{ secrets.SMTP_CREDENTIAL }}

      - name: Send email notification
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASS }}
          subject: "[${{ github.event.repository.name }}] ${{ github.event_name == 'issues' && 'Issue' || 'PR' }}"
          to: ${{ env.SMTP_USER }}
          from: GitHub Notify <${{ env.SMTP_USER }}>
          body: |
            Event: ${{ github.event_name }}
            Actor: ${{ github.actor }}
            Title: ${{ github.event.issue.title || github.event.pull_request.title }}
            URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
            Action: ${{ github.event.action }}

  # Merged from bot-governance.yml (deleted).
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Only govern pull requests whose branch lives in this repository.
    #
    # Technically: a pull_request run from a fork gets a read-only GITHUB_TOKEN
    # whatever the permissions block above asks for, and `gh pr close` and
    # `gh pr comment` are both unguarded under `set -e`, so the job would fail.
    #
    # More importantly: what it would be trying to do there is close an
    # outsider's pull request because somebody else's bot spent the day's rate
    # limit. Every bot this governs pushes its branch into this repository, so
    # nothing is lost by not running.
    #
    # Comparing head.repo.full_name against the repository asks whether the
    # branch lives here. head.repo.fork answers a different question — whether
    # the source repository is itself a fork — which would silently disable
    # governance for internal branches if this repository ever became one.
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          BOT_PR_AUTOCLOSE: ${{ vars.BOT_PR_AUTOCLOSE }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # Rate limit: max five bot PRs per actor in a rolling 24-hour window.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state all --limit 1000 \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length" 2>/dev/null || echo 0)

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            if [ "${BOT_PR_AUTOCLOSE:-false}" != "true" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" \
                --add-label "bot-rate-limit-exceeded" || true
              echo "Rate limit exceeded ($COUNT/5) but BOT_PR_AUTOCLOSE is not 'true': labelled only."
              exit 0
            fi
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # Duplicate detection by title keyword. Closed PRs are not duplicates
          # of an open PR; the rate-limit query above intentionally includes them.
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD" --limit 1000 \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   2>/dev/null || echo 0)

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open --limit 1000\`"
          fi
