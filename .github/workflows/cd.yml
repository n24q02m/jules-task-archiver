name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      force:
        description: "Force release level (when no version-worthy commits)"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: n24q02m/better-semantic-release@2e4d8122661f080fec53632f2b93d8d80a45b331 # main: live-verifying the action.sh argv rewrite + setup-uv v8 before they reach v1
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          config_file: semantic-release.toml
          prerelease: ${{ inputs.release_type == 'beta' }}
          prerelease_token: beta
          force: ${{ inputs.force != 'none' && inputs.force || '' }}

      - uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

  package:
    name: Package Extension
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update manifest version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Convert semver to Chrome-compatible version (integers only)
          # 2.0.0 -> 2.0.0 | 2.0.0-beta.1 -> 2.0.0.1 | 2.0.0-beta.3 -> 2.0.0.3
          CHROME_VERSION=$(echo "$VERSION" | sed -E 's/-[a-z]+\.([0-9]+)$/.\1/' | sed -E 's/-[a-z]+$//')
          echo "Semver: $VERSION -> Chrome: $CHROME_VERSION"
          jq --arg v "$CHROME_VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Package extension zip
        run: |
          zip -r jules-task-archiver.zip \
            manifest.json \
            background.js \
            content.js \
            main-world.js \
            popup.html \
            popup.js \
            popup.css \
            utils.js \
            icons/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" jules-task-archiver.zip --clobber
