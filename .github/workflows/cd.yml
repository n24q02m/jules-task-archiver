# =============================================================================
# CD Template: TypeScript. Publish steps are opt-in per repo via
# vars.PUBLISH_NPM / vars.PUBLISH_MCP_REGISTRY.
# (Historical "Source:" pointer removed 2026-10-06: n24q02m/.github verified
# to contain no templates -- FUNDING.yml/LICENSE/README/renovate.json only.)
#
# Pipeline: better-semantic-release -> npm (OIDC) -> MCP Registry
#
# Everything here is rendered ready to run. There is no "CUSTOMIZE" pass any more:
# every placeholder this template used to leave behind was found unfilled in a repo
# that had never released, all at once, on the day of its first release. Whatever a
# repo genuinely needs to differ on belongs in a template variable, not in a comment
# asking a human to remember.
# =============================================================================
name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      publish_existing_tag:
        description: "Recovery only: publish an already-created tag (e.g. v3.1.0), skipping semantic-release. Use when the auto-computed version's tag name is permanently reserved by a GitHub immutable release."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

env:
  # Release lane: dispatch-only (release_type=beta, then stable); a push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}

# A release must finish once started: cancelling it between the version tag and the
# registry upload strands a tag with no artifact, so the group serializes dispatches.
# ci-policy: allow concurrency reason: serialize releases, never cancel one mid-publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================================
  # README registry metadata: npm serves the README off the published tarball
  # and the MCP registry serves the description out of server.json, so a repo
  # can look right while both listings read wrong. Runs before the release, not
  # beside it -- an npm version number can never be republished.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ============================================================================
  # Release: better-semantic-release (bsr)
  # ============================================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.released || steps.forced.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.forced.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.forced.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease || steps.forced.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Version bump runs on the fork (orphan-tag + registry-collision guards).
      # The publish step below stays upstream — the fork does not replace it.
      - uses: n24q02m/better-semantic-release@0cc137a9f9254fb4163d727c20026cb81a5a6880 # v1.13.1
        id: release
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Not optional: without it the run silently falls back to defaults and
          # ignores tag_format / allow_zero_version / major_on_zero. That does not
          # fail the job -- it publishes a wrong version number.
          config_file: semantic-release.toml
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: inputs.publish_existing_tag == '' && steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Use existing tag (immutable-release recovery)
        id: forced
        if: inputs.publish_existing_tag != ''
        run: |
          TAG="${{ inputs.publish_existing_tag }}"
          VERSION="${TAG#v}"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Publish to npm
  # ============================================================================
  publish-npm:
    name: Publish to npm
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run build
      # OIDC trusted publishing -- no NPM_TOKEN needed. Verify with `gh secret
      # list` on this repo: no npm token should be set. --provenance needs
      # id-token: write, granted above.
      - run: npm publish --provenance --no-git-checks --tag ${{ needs.release.outputs.is_prerelease == 'true' && 'beta' || 'latest' }}

  # ============================================================================
  # Publish to MCP Registry (stable only)
  # ============================================================================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-npm]
    if: >-
      needs.release.outputs.released == 'true'
      && needs.release.outputs.is_prerelease != 'true'
      && vars.PUBLISH_NPM == 'true'
      && vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] |
              if .registryType == "oci" then del(.version)
              else .version = $v
              end
            ]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$out"
          set -e
          if [ $rc -ne 0 ] && echo "$out" | grep -q "cannot publish duplicate version"; then
            echo "duplicate version already in registry - idempotent recovery, treating as success"
            exit 0
          fi
          exit $rc

  package:
    name: Package Extension
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update manifest version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Convert semver to Chrome-compatible version (integers only)
          # 2.0.0 -> 2.0.0 | 2.0.0-beta.1 -> 2.0.0.1 | 2.0.0-beta.3 -> 2.0.0.3
          CHROME_VERSION=$(echo "$VERSION" | sed -E 's/-[a-z]+\.([0-9]+)$/.\1/' | sed -E 's/-[a-z]+$//')
          echo "Semver: $VERSION -> Chrome: $CHROME_VERSION"
          jq --arg v "$CHROME_VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Package extension zip
        run: |
          zip -r jules-task-archiver.zip \
            manifest.json \
            background.js \
            content.js \
            main-world.js \
            popup.html \
            popup.js \
            popup.css \
            utils.js \
            icons/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" jules-task-archiver.zip --clobber
